name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'

      - name: Set up Kex and Tey
        uses: kexhq/setup-tey@v1
        with:
          kex-version: '0.4.0-beta.4'
          erlang: 'false'

      - run: tey install
      - run: tey build
      - run: tey test
