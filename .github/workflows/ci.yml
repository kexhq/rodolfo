name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rodolfo's package.kex now uses Tey's `workspace` feature, and the
      # tey.lock it writes needs a Tey that understands that lockfile's
      # schema to read it back. Neither has shipped in a Kex release yet —
      # 0.4.0-beta, the newest tag, predates both, so `kexhq/setup-tey`
      # (which only ever installs a published release archive) cannot get
      # us a working toolchain here. Until a release ships them, build Kex
      # and Tey from source. Swap this for `kexhq/setup-tey@v1` again once a
      # release carries the workspace feature.
      #
      # `main`, deliberately, and NOT a pinned commit. Building rodolfo is
      # what surfaces compiler defects — docs/kex-issues.md is the record of
      # that — so a pin freezes the canary: breakage goes unnoticed until
      # somebody bumps the SHA by hand, which is how the private-visibility
      # regression reached us. The cost is that a red build here no longer
      # proves rodolfo changed; the failure text says which side it came
      # from, and the pin can come back temporarily to bisect one.
      - name: Check out Kex
        uses: actions/checkout@v4
        with:
          repository: kexhq/kex
          ref: main
          path: kex-src

      # Matches kexhq/kex's own CI (.github/workflows/ci.yml, the
      # build-tey job) so the toolchain built here behaves the same way.
      - name: Install Kex build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgmp-dev libpcre2-dev libreadline-dev \
            libssl-dev erlang-base libboost-context-dev

      - name: Build Kex and Tey
        working-directory: kex-src
        run: |
          cmake -B build -G "Unix Makefiles" -DKEX_BOOST_STATIC=ON
          cmake --build build --parallel
          make build-tey
          make tey-run

      # `tey-run` (generated above) is a Tey launcher for this checkout; its
      # default TEY_ERL is whatever `erl` built it on the machine that ran
      # `make tey-run`, which is not this runner. A `tey` on PATH that
      # forwards to it, with TEY_ERL pointed at this runner's own `erl`,
      # keeps every later step's command (`tey install`, `tey build`, `tey
      # test`) identical to what it was against a released toolchain.
      - name: Put a `tey` wrapper on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/tey" <<WRAP
          #!/bin/sh
          export TEY_ERL="$(command -v erl)"
          exec "$GITHUB_WORKSPACE/kex-src/tey-run" "\$@"
          WRAP
          chmod +x "$HOME/.local/bin/tey"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: tey install
      - run: tey build
      - run: tey test
